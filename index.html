<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Strict CSP: only trusted CDNs/APIs are allowed; YouTube embeds restricted to nocookie domain. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.youtube.com https://www.youtube-nocookie.com https://s.ytimg.com https://www.gstatic.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        img-src 'self' data: blob: https:;
        media-src 'self' blob: https:;
        connect-src 'self' https: wss:;
        frame-src https://www.youtube.com https://www.youtube-nocookie.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self';" />
    <title>Sentify — Music for Every Mood</title>
    <meta name="description" content="Sentify is a free, ad-free music streaming web player with mood-based discovery, lyrics, search, and full-length playback." />
    <meta name="author" content="Sentify" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <meta property="og:title" content="Sentify — Music for Every Mood" />
    <meta property="og:description" content="Free ad-free music with mood filters, lyrics, and full-length playback." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
