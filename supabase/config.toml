# Edge function auth posture:
# - yt-search stays public (verify_jwt = false) for guest Home browsing.
# - translate-lyrics requires a valid Supabase JWT so paid AI credits can only
#   be spent by signed-in Sentify users.
[functions.yt-search]
verify_jwt = false

[functions.translate-lyrics]
verify_jwt = true

[functions.analyze-track]
verify_jwt = true

# The MCP server validates OAuth bearer tokens itself (mcp-js resource server),
# so Supabase's edge gateway must not 401 before the SDK's verifier runs.
[functions.mcp]
verify_jwt = false

